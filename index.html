<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14213d">
  <meta name="description" content="Controle de alunos e mensalidades da academia">
  <title>Mensalidades</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <h1 id="titulo">Painel</h1>
    <button id="btn-novo-aluno" class="btn-topo" aria-label="Novo aluno">+ Aluno</button>
  </header>

  <main id="conteudo"></main>

  <nav class="abas">
    <button data-aba="painel" class="ativa"><span>🏠</span>Painel</button>
    <button data-aba="mes"><span>📅</span>Mês</button>
    <button data-aba="atrasados"><span>⚠️</span>Atrasos<b id="badge-atrasos" class="badge" hidden></b></button>
    <button data-aba="alunos"><span>🥋</span>Alunos</button>
    <button data-aba="relatorios"><span>📊</span>Relatórios</button>
    <button data-aba="config"><span>⚙️</span>Ajustes</button>
  </nav>

  <dialog id="modal">
    <div id="modal-corpo"></div>
  </dialog>

  <div id="aviso" class="aviso" hidden></div>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
